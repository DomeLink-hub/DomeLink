services:
  postgres:
    image: postgres:16-alpine
    container_name: domelink-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: domelink_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d domelink_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domelink-api
    restart: always
    ports:
      - "5000:5000"
    # Looking for the .env file in the current directory
    env_file:
      - .env

volumes:
  postgres_data: